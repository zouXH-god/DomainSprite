name: Build
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm run typecheck
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          retention-days: 3
  backend-test:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - run: go test ./...
      - run: go vet ./...
  build:
    needs: [frontend, backend-test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
      - name: Build standalone binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          mkdir -p build
          go build -trimpath -ldflags "-s -w -X DDNSServer/webui.Version=${GITHUB_REF_NAME} -X DDNSServer/webui.BuildVersion=${GITHUB_SHA}" -o "build/DomainSprite-${GOOS}-${GOARCH}${suffix}" .
          grep -a -q "DomainSprite Console" "build/DomainSprite-${GOOS}-${GOARCH}${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: DomainSprite-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/DomainSprite-*
          if-no-files-found: error
  node-build:
    needs: backend-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Build lightweight certificate node
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          mkdir -p build
          output="build/DomainSpriteNode-${GOOS}-${GOARCH}${suffix}"
          go build -tags node -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$output" ./cmd/node
          test $(stat -c%s "$output") -le 30000000
          if go list -deps -tags node ./cmd/node | grep -E 'github.com/gin-gonic/gin|gorm.io/gorm|github.com/hibiken/asynq|github.com/mattn/go-sqlite3|DDNSServer/webui'; then
            echo "forbidden controller dependency found in node binary" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: DomainSpriteNode-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/DomainSpriteNode-*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, node-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: DomainSprite*
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/DomainSprite* update.sh --title "DomainSprite ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md --generate-notes --verify-tag
